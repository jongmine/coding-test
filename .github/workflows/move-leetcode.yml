name: Move LeetCode Files

on:
  push:
    branches:
      - main

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Organize LeetCode Files
        run: |
          mkdir -p LeetCode
          # 예외 목록(! -name)
          find . -maxdepth 1 -type d ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'LeetCode' ! -name 'dingcorithm' ! -name '프로그래머스' -exec mv {} LeetCode/ \;

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-organize LeetCode folder" && git push)
