name: Move LeetCode Files

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: move-leetcode
  cancel-in-progress: false

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move LeetCode folders
        run: |
          shopt -s nullglob
          mkdir -p LeetCode
          # LeetHub 폴더 규칙: 숫자 4자리로 시작 (예: 0001-two-sum)
          for dir in [0-9][0-9][0-9][0-9]-*/; do
            name="${dir%/}"
            if [ -e "LeetCode/$name" ]; then
              cp -a "$name"/. "LeetCode/$name"/
              rm -rf "$name"
            else
              mv "$name" LeetCode/
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi

          OLD_HEAD=$(git rev-parse HEAD)
          SUBJECT=$(git log -1 --pretty=%s)

          case "$SUBJECT" in
            *"- LeetHub")
              # LeetHub 커밋이면 메시지(수행시간 등)를 그대로 두고 이동 내역만 합침
              # 합친 결과가 빈 커밋이어도 제출 기록(메시지)을 남기기 위해 --allow-empty
              git commit --amend --no-edit --allow-empty
              git push --force-with-lease=main:"$OLD_HEAD" origin HEAD:main
              ;;
            *)
              git commit -m "chore: move LeetCode folders"
              git pull --rebase origin main
              git push
              ;;
          esac
