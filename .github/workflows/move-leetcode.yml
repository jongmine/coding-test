name: Move LeetCode Files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move newly added LeetCode folders
        run: |
          # 최신 커밋 메시지가 LeetHub 커밋이 아니면 종료 (백준 등은 건드리지 않음)
          MSG=$(git log -1 --pretty=%s)
          case "$MSG" in
            *"- LeetHub") ;;
            *) echo "LeetHub 커밋이 아님, 건너뜀: $MSG"; exit 0 ;;
          esac

          # 첫 커밋이라 비교 대상이 없으면 종료
          git rev-parse HEAD~1 >/dev/null 2>&1 || exit 0

          mkdir -p LeetCode

          # 이번 커밋이 새로 추가한 파일들의 최상위 폴더만 추출
          git diff --name-only --diff-filter=A HEAD~1 HEAD \
            | cut -d/ -f1 | sort -u \
            | while read -r name; do
                [ -z "$name" ] && continue
                [ "$name" = "LeetCode" ] && continue
                [ -d "$name" ] || continue
                if [ -e "LeetCode/$name" ]; then
                  echo "LeetCode/$name 이미 존재, 건너뜀"
                  continue
                fi
                mv "$name" LeetCode/
              done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: move LeetCode folders"
          git pull --rebase origin main
          git push
